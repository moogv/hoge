name: ChatWork Notify

on:
  push:
    branches: [main, develop, phase2]   # 対象ブランチ。全ブランチにするならこの2行を削除
  pull_request:
    types: [opened, closed, reopened, ready_for_review]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Build & post message
        env:
          # 全て一度環境変数に安全に格納します（インジェクション・文字崩れ対策）
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CHATWORK_TOKEN: ${{ secrets.CHATWORK_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: |
          NL=$'\n'
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            COMMIT_COUNT=$(echo "$COMMITS_JSON" | jq 'length')
            COMMITS=$(echo "$COMMITS_JSON" | jq -r '.[] | "・\(.message | split("\n")[0]) (\(.author.name))\n  \(.url)"')
            BODY="[info][title]【Push】${GITHUB_REPOSITORY} / ${GITHUB_REF_NAME}[/title]プッシュ者 : ${GITHUB_ACTOR}${NL}コミット数 : ${COMMIT_COUNT} 件${NL}━━━━━━━━━━━━━━━━${NL}${COMMITS}[/info]"
          else
            ACTION="$PR_ACTION"
            if [ "$ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
              ACTION="merged"
            fi
            case "$ACTION" in
              opened)           ACTION_LABEL="PR が作成されました" ;;
              merged)           ACTION_LABEL="PR がマージされました" ;;
              closed)           ACTION_LABEL="PR がクローズされました" ;;
              reopened)         ACTION_LABEL="PR が再オープンされました" ;;
              ready_for_review) ACTION_LABEL="レビュー依頼が届きました" ;;
              *)                ACTION_LABEL="PR が更新されました (${ACTION})" ;;
            esac
            BODY="[info][title]【PR #${PR_NUMBER}】${ACTION_LABEL}[/title]タイトル   : ${PR_TITLE}${NL}リポジトリ : ${GITHUB_REPOSITORY}${NL}ブランチ   : ${PR_HEAD_REF} → ${PR_BASE_REF}${NL}担当者     : ${GITHUB_ACTOR}${NL}URL        : ${PR_URL}[/info]"
          fi
          
          curl -s -X POST \
            -H "X-ChatWorkToken: $CHATWORK_TOKEN" \
            --data-urlencode "body=${BODY}" \
            "https://api.chatwork.com/v2/rooms/${CHATWORK_ROOM_ID}/messages"